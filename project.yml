# XcodeGen-Projektdefinition – `xcodegen generate` erzeugt NightscoutRemote.xcodeproj
name: NightscoutRemote
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  NightscoutRemote:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
      - Assets.xcassets
    scheme: {}
    settings:
      base:
        # Platzhalter fuer lokale Builds. Der GitHub-Build setzt
        # automatisch com.<TEAMID>.nightscoutremote (oder die Variable BUNDLE_ID).
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nightscoutremote
        PRODUCT_NAME: NightscoutRemote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Nightscout Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
